[package]
name = "hnl-tool-typecheck-nbe"
version = "0.1.0"
edition = "2024"
description = "A data-driven, normalization-based typecheck engine implementing the [`TypecheckEngine`] trait (ADR-0054 — Generic Typecheck Engine)."
license = "MIT"
repository = "https://github.com/handl-lang/tool-typecheck-nbe"
homepage = "https://handl-lang.github.io/docs/tool-typecheck-nbe/"
documentation = "https://handl-lang.github.io/docs/tool-typecheck-nbe/reference/"
readme = "README.md"
keywords = ["handl", "engine", "typecheck", "nbe"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/tool-typecheck-nbe (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-exec = { git = "https://github.com/handl-lang/exec", branch = "main" }
hnl-tool-typecheck = { git = "https://github.com/handl-lang/tool-typecheck", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
handl-plugin-lib-tag = { git = "https://github.com/handl-lang/host", branch = "main" }
rustc-hash = "2"
serde_json = "1"
# WS-H: growable stack for judgment evaluation — `eval_judgment` hops
# are several large debug frames each, so deep AST/term recursion is
# bounded by memory, not the host thread's stack size.
stacker = "0.1"

[dev-dependencies]
hnl-exec-tree-walk = { git = "https://github.com/handl-lang/exec-tree-walk", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse = { git = "https://github.com/handl-lang/tool-parse", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
handl-plugin-module = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-kit-data-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
