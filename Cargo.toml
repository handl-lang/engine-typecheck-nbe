[package]
name = "handl-plugin-engine-typecheck-nbe"
version.workspace = true
edition.workspace = true
description = "A **data-driven, normalization-based typecheck engine** implementing the [`TypecheckEngine`] trait (ADR-0054 — Generic Typecheck Engine)."
license.workspace = true
repository.workspace = true

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-exec = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-typecheck = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
plugin-engine = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-plugin-lib-tag = { git = "https://github.com/handl-lang/platform", branch = "main" }
serde_json = "1"

[dev-dependencies]
handl-plugin-engine-exec-tree-walk = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-lex-pattern = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-parse = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-engine-parse-pratt = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-plugin-module = { git = "https://github.com/handl-lang/platform", branch = "main" }
handl-kit-data-canonical = { git = "https://github.com/handl-lang/lang", branch = "main" }
